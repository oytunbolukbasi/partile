<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Tarih anketi — misafir oyu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&amp;family=Hanken+Grotesk:wght@400..800&amp;family=Fraunces:ital,opsz,wght@0,9..144,300..900&amp;family=Unbounded:wght@500;800&amp;display=swap">
<style>
body{margin:0;font-family:'Hanken Grotesk',sans-serif;background:#160804;color:#FFF1E3}
a{color:#FFF1E3}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 1180px; position: relative; overflow: hidden; background: radial-gradient(90% 26% at 20% 4%, #C2410C 0%, rgba(194,65,12,0) 70%), radial-gradient(70% 22% at 90% 12%, #F59E0B 0%, rgba(245,158,11,0) 70%), #160804; color: #FFF1E3; font-family: 'Hanken Grotesk', sans-serif; display: flex; flex-direction: column">
<div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
<a href="Home.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #FFF1E3"><span style="width: 30px; height: 30px; border-radius: 9px; background: radial-gradient(70% 70% at 25% 20%, #FF6A3D 0%, rgba(255,106,61,0) 70%), radial-gradient(60% 60% at 85% 30%, #FFB020 0%, rgba(255,176,32,0) 70%), #0C0C0D; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 200 200" aria-hidden="true"><rect x="40" y="42" width="44" height="130" rx="22" fill="#FFFFFF"></rect><circle cx="118" cy="92" r="50" fill="none" stroke="#FFFFFF" stroke-width="44"></circle><circle cx="118" cy="92" r="28" fill="#0C0C0D"></circle><path d="M104 93l10 10 20-22" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span style="font: 800 22px 'Schibsted Grotesk', sans-serif; letter-spacing: -0.6px">partile</span></a>
<a href="#" style="height: 40px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-weight: 700; font-size: 15px; display: flex; align-items: center; text-decoration: none">Giriş</a>
</div>

<div style="padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 22px">
<h1 style="margin: 0; text-align: center; font-family: 'Fraunces', serif; font-weight: 800; font-size: 50px; line-height: 1; letter-spacing: -1.4px">Ece 30 Oluyor</h1>
<div style="position: relative; width: 358px; height: 220px; border-radius: 12px; overflow: hidden; background: radial-gradient(70% 60% at 25% 20%, #C2410C 0%, rgba(194,65,12,0) 70%), radial-gradient(60% 55% at 85% 35%, #F59E0B 0%, rgba(245,158,11,0) 70%), #160804; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 120px; letter-spacing: -7px; color: #FFF1E3; text-shadow: 0 0 60px rgba(255,177,71,0.7)">30</span></div>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.16)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font: 700 18px 'Schibsted Grotesk', sans-serif">Tarih netleşmedi</span><span style="font-size: 14px; opacity: 0.85">Oytun hangi gün olsun diye soruyor — her seçeneğe oy ver</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
<div style="border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font: 700 19px 'Schibsted Grotesk', sans-serif">{{o.day}}</span><span style="font-size: 14px; opacity: 0.8">{{o.time}}</span></div>
<div style="height: 8px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden; display: flex"><span style="width: {{o.yesW}}; background: #FFB547"></span><span style="width: {{o.maybeW}}; background: rgba(255,255,255,0.45)"></span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; opacity: 0.85"><span>{{o.yes}} evet · {{o.maybe}} belki</span><span>{{o.no}} hayır</span></div>
<div role="radiogroup" aria-label="{{o.day}} için oyun" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" role="radio" aria-checked="{{o.yesSel}}" onClick="{{o.pickYes}}" style="height: 44px; box-sizing: border-box; border-radius: 999px; border: 0; background: {{o.yesBg}}; color: {{o.yesFg}}; font: 800 14px 'Hanken Grotesk', sans-serif">Evet</button>
<button type="button" role="radio" aria-checked="{{o.maybeSel}}" onClick="{{o.pickMaybe}}" style="height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: {{o.maybeBg}}; color: #FFF1E3; font: 700 14px 'Hanken Grotesk', sans-serif">Belki</button>
<button type="button" role="radio" aria-checked="{{o.noSel}}" onClick="{{o.pickNo}}" style="height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,0.3); background: {{o.noBg}}; color: #FFF1E3; font: 700 14px 'Hanken Grotesk', sans-serif">Hayır</button>
</div>
</div>
</sc-for>
</div>

<a href="InviteMobile.dc.html" style="height: 56px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font: 800 16px 'Hanken Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Oyları gönder</a>
<div style="text-align: center; font-size: 13px; opacity: 0.75">Gün seçilince oyun otomatik katılıma dönüşür, sana haber veririz.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: [0, 1, 2] }; }
  renderVals() {
    const base = [
      { day: 'Cmt, 17 Ekim', time: '20:00', yes: 9, maybe: 3, no: 1 },
      { day: 'Cum, 23 Ekim', time: '20:30', yes: 5, maybe: 4, no: 3 },
      { day: 'Cmt, 24 Ekim', time: '19:30', yes: 7, maybe: 2, no: 2 }
    ];
    const v = this.state.v;
    const set = (i, val) => { const n = v.slice(); n[i] = val; this.setState({ v: n }); };
    return {
      opts: base.map((o, i) => {
        const tot = o.yes + o.maybe + o.no;
        return {
          ...o,
          yesW: Math.round(o.yes / tot * 100) + '%',
          maybeW: Math.round(o.maybe / tot * 100) + '%',
          yesSel: v[i] === 0 ? 'true' : 'false', maybeSel: v[i] === 1 ? 'true' : 'false', noSel: v[i] === 2 ? 'true' : 'false',
          yesBg: v[i] === 0 ? '#FFB547' : 'rgba(255,255,255,0.14)', yesFg: v[i] === 0 ? '#160804' : '#FFF1E3',
          maybeBg: v[i] === 1 ? 'rgba(255,255,255,0.3)' : 'transparent',
          noBg: v[i] === 2 ? 'rgba(255,255,255,0.3)' : 'transparent',
          pickYes: () => set(i, 0), pickMaybe: () => set(i, 1), pickNo: () => set(i, 2)
        };
      })
    };
  }
}
</script>
</body>
</html>
