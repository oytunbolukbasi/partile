<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Konum seç</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&amp;family=Hanken+Grotesk:wght@400..800&amp;family=Fraunces:ital,opsz,wght@0,9..144,800&amp;display=swap">
<style>
body{margin:0;font-family:'Hanken Grotesk',sans-serif;background:#160804;color:#F5F2EC}
a{color:#F5F2EC}a:hover{color:#FFFFFF}
input::placeholder{color:#A8A39B}
</style>
</helmet>
<div style="width: 1440px; height: 960px; position: relative; overflow: hidden; background: radial-gradient(48% 42% at 18% 8%, #C2410C 0%, rgba(194,65,12,0) 70%), radial-gradient(40% 36% at 82% 22%, #F59E0B 0%, rgba(245,158,11,0) 70%), #160804; color: #F5F2EC; font-family: 'Hanken Grotesk', sans-serif">
<div style="position: absolute; left: 216px; top: 120px; opacity: 0.3; font: 800 60px 'Fraunces', serif; letter-spacing: -1.5px; color: #FFF1E3">Ece 30 Oluyor</div>
<div style="position: absolute; left: 690px; top: 126px; width: 358px; height: 358px; border-radius: 12px; opacity: 0.3; background: radial-gradient(70% 60% at 25% 20%, #C2410C 0%, rgba(194,65,12,0) 70%), #160804"></div>
<div style="position: absolute; inset: 0; background: rgba(6,3,2,0.6)"></div>
__RAIL:create:960__

<div role="dialog" aria-labelledby="lp-title" style="position: absolute; left: 260px; top: 80px; width: 920px; height: 800px; box-sizing: border-box; border-radius: 24px; background: #121213; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 40px 100px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden">
<div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.08)"><a href="Create.dc.html" aria-label="Kapat" style="width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #F5F2EC"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></a><h1 id="lp-title" style="margin: 0; font: 700 18px 'Schibsted Grotesk', sans-serif">Nerede?</h1><span style="width: 40px"></span></div>
<div style="display: flex; flex-grow: 1; min-height: 0">
<section style="width: 440px; flex-shrink: 0; box-sizing: border-box; padding: 20px; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.3)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8A39B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><label for="lq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mekân ara</label><input id="lq" type="text" value="Moda deniz kul" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; color: #F5F2EC; font: 600 16px 'Hanken Grotesk', sans-serif"><span style="height: 26px; padding: 0 8px; border-radius: 6px; background: rgba(255,255,255,0.1); font-size: 11px; font-weight: 800; color: #A8A39B">Google</span></div>
<div style="display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1)">
<sc-for list="{{results}}" as="r" hint-placeholder-count="4">
<button type="button" onClick="{{r.pick}}" aria-pressed="{{r.sel}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid rgba(255,255,255,0.06); background: {{r.bg}}; color: #F5F2EC; text-align: left; font-family: 'Hanken Grotesk', sans-serif"><span style="width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 700; font-size: 15px">{{r.name}}</span><span style="font-size: 13px; color: #A8A39B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.addr}}</span></span></button>
</sc-for>
</div>
<button type="button" style="height: 44px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.25); background: transparent; color: #F5F2EC; font: 700 14px 'Hanken Grotesk', sans-serif">Listede yok, adresi kendim yazayım</button>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700">Davetiyede nasıl görünsün?</span>
<div role="radiogroup" aria-label="Adres gösterimi" style="display: flex; gap: 8px">
<button type="button" role="radio" aria-checked="{{semtSel}}" onClick="{{pickSemt}}" style="flex-grow: 1; height: 44px; border-radius: 999px; border: {{semtBorder}}; background: {{semtBg}}; color: #F5F2EC; font: 700 13px 'Hanken Grotesk', sans-serif">Yalnız semt</button>
<button type="button" role="radio" aria-checked="{{fullSel}}" onClick="{{pickFull}}" style="flex-grow: 1; height: 44px; border-radius: 999px; border: {{fullBorder}}; background: {{fullBg}}; color: #F5F2EC; font: 700 13px 'Hanken Grotesk', sans-serif">Tam adres</button>
</div>
<span style="font-size: 12px; color: #A8A39B; line-height: 1.45">{{hint}}</span>
</div>
</section>
<section style="flex-grow: 1; position: relative; overflow: hidden; background: #1A1B1E">
<div style="position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 48px), repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 48px), radial-gradient(60% 40% at 30% 70%, #12313A 0%, rgba(18,49,58,0) 70%), #1A1B1E"></div>
<div style="position: absolute; left: -40px; top: 140px; width: 620px; height: 22px; background: #2A2C31; transform: rotate(-18deg); border-radius: 999px"></div>
<div style="position: absolute; left: 120px; top: 40px; width: 18px; height: 700px; background: #2A2C31; transform: rotate(12deg); border-radius: 999px"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(180deg, rgba(18,49,58,0) 0%, #12313A 60%); "></div>
<div style="position: absolute; left: 60px; bottom: 90px; font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 1px">MARMARA DENİZİ</div>
<div style="position: absolute; left: 236px; top: 300px; display: flex; flex-direction: column; align-items: center"><span style="height: 36px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-weight: 800; font-size: 13px; display: flex; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.4); margin-bottom: 6px">{{pinLabel}}</span><svg width="44" height="44" viewBox="0 0 24 24" fill="#FF6A3D" stroke="#0C0C0D" stroke-width="1" aria-hidden="true"><path d="M12 22s-7-6.4-7-11.7A7 7 0 0 1 19 10.3C19 15.6 12 22 12 22z"></path><circle cx="12" cy="10.3" r="2.6" fill="#0C0C0D"></circle></svg></div>
<sc-if value="{{semt}}" hint-placeholder-val="{{true}}"><div style="position: absolute; left: 150px; top: 240px; width: 220px; height: 180px; border-radius: 999px; border: 2px dashed rgba(255,255,255,0.4); background: rgba(255,106,61,0.12)"></div></sc-if>
<div style="position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 6px"><button type="button" aria-label="Yakınlaştır" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: #FFFFFF; color: #0C0C0D; font: 800 20px 'Hanken Grotesk', sans-serif">+</button><button type="button" aria-label="Uzaklaştır" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: #FFFFFF; color: #0C0C0D; font: 800 20px 'Hanken Grotesk', sans-serif">−</button></div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-radius: 16px; background: rgba(12,12,13,0.85); border: 1px solid rgba(255,255,255,0.12)"><span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-weight: 700">{{selName}}</span><span style="font-size: 13px; color: #A8A39B">{{selAddr}}</span></span><a href="Create.dc.html" style="height: 44px; padding: 0 20px; border-radius: 999px; background: #FFFFFF; color: #0C0C0D; font-weight: 800; font-size: 14px; display: flex; align-items: center; text-decoration: none">Konumu seç</a></div>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { r: 0, semt: true }; }
  renderVals() {
    const list = [
      { name: 'Moda Deniz Kulübü', addr: 'Caferağa, Moda Cad. 12, Kadıköy' },
      { name: 'Moda Sahil Parkı', addr: 'Caferağa, Moda Sahil Yolu, Kadıköy' },
      { name: 'Moda Çay Bahçesi', addr: 'Caferağa, Moda İskele Sk., Kadıköy' },
      { name: 'Moda Deniz Kulübü Yat Limanı', addr: 'Caferağa, Kadıköy' }
    ];
    const r = this.state.r, semt = this.state.semt, sel = list[r];
    return {
      results: list.map((x, i) => ({ ...x, sel: i === r ? 'true' : 'false', bg: i === r ? 'rgba(255,255,255,0.1)' : 'transparent', pick: () => this.setState({ r: i }) })),
      semt, semtSel: semt ? 'true' : 'false', fullSel: semt ? 'false' : 'true',
      semtBorder: semt ? '1px solid rgba(255,255,255,0.5)' : '1px solid rgba(255,255,255,0.14)', semtBg: semt ? 'rgba(255,255,255,0.14)' : 'transparent',
      fullBorder: semt ? '1px solid rgba(255,255,255,0.14)' : '1px solid rgba(255,255,255,0.5)', fullBg: semt ? 'transparent' : 'rgba(255,255,255,0.14)',
      pickSemt: () => this.setState({ semt: true }), pickFull: () => this.setState({ semt: false }),
      hint: semt ? 'Davetiyede “Moda, Kadıköy” yazar; tam adres ve harita linki katılım bildirenlere açılır.' : 'Tam adres ve harita linki herkese görünür (herkese açık planlar için).',
      pinLabel: semt ? 'Moda, Kadıköy' : sel.name, selName: sel.name, selAddr: sel.addr
    };
  }
}
</script>
</body>
</html>
