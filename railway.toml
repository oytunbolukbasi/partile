# Railway service config for the web app. Cron for reminders is a separate Railway cron service (see DEPLOY.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# The runtime image has no pnpm; always start the standalone server directly.
startCommand = "node apps/web/server.js"
healthcheckPath = "/api/saglik"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
