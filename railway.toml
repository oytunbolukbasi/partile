# Railway service config for the web app. Cron for reminders is a separate Railway cron service (see DEPLOY.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# The runtime image has no pnpm; start.sh binds 0.0.0.0 and honours Railway's PORT.
startCommand = "/app/start.sh"
healthcheckPath = "/api/saglik"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
